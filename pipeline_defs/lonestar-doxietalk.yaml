name: lonestar-doxietalk
version: "2.0"
description: >
  Monthly video podcast production pipeline for Lone Star Doxie Talk (Central Texas Dachshund Rescue),
  hosted by Charlie. Coordinates host monologue, Happy Tails adoption showcase, Rainbow Bridge memorials,
  specialty comedy sketches/B-roll, and YouTube packaging.
category: custom
stability: production

orchestration:
  mode: executive-producer
  skill: pipelines/lonestar-doxietalk/executive-producer
  budget_default_usd: 5.00
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 25

compatible_playbooks:
  recommended:
    - lonestar-doxietalk
  also_works:
    - clean-professional
  custom_allowed: true

required_skills:
  - pipelines/lonestar-doxietalk/executive-producer
  - pipelines/lonestar-doxietalk/idea-director
  - pipelines/lonestar-doxietalk/script-director
  - pipelines/lonestar-doxietalk/scene-director
  - pipelines/lonestar-doxietalk/asset-director
  - pipelines/lonestar-doxietalk/edit-director
  - pipelines/lonestar-doxietalk/compose-director
  - pipelines/lonestar-doxietalk/publish-director
  - meta/reviewer
  - meta/checkpoint-protocol

stages:
  - name: idea
    skill: pipelines/lonestar-doxietalk/idea-director
    produces:
      - brief
      - decision_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Episode theme, month, and topics are clearly defined
      - Happy Tails adoption roster and dog photo availability confirmed
      - Optional Rainbow Bridge or specialty sketch/cutaway determined
      - Host visual starting frame (standard or seasonal) chosen
    success_criteria:
      - Schema-valid brief artifact
      - Brief records host anchor, adoption count, and segment breakdown

  - name: script
    skill: pipelines/lonestar-doxietalk/script-director
    required_artifacts_in:
      - brief
    produces:
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - 'Mandatory greeting: "I''m Charlie and this here''s Lone Star Doxie Talk."'
      - 'Mandatory sign-off: "Until next time, remember, a rescued heart never forgets."'
      - Embedded Happy Tails segment dives straight into dog stories without duplicating show intros
      - Clean double-newline paragraph separation for human-like ElevenLabs TTS cadence
      - Conclusion recaps all covered topics and issues a warm CTDR volunteer/donation call-to-action
    success_criteria:
      - Schema-valid script artifact
      - Script contains all required segments with exact anchor lines

  - name: scene_plan
    skill: pipelines/lonestar-doxietalk/scene-director
    required_artifacts_in:
      - script
    optional_artifacts_in:
      - brief
    produces:
      - scene_plan
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Clear separation between host avatar shots, Remotion adoption montage, and specialty sketches
      - Visual framing for dog adoption photos and lower-third badges
      - Acoustic guitar BGM track and ducking planned across segments
    success_criteria:
      - Schema-valid scene_plan artifact
      - Every segment has defined timing, visuals, and audio stems

  - name: assets
    skill: pipelines/lonestar-doxietalk/asset-director
    required_artifacts_in:
      - scene_plan
    produces:
      - asset_manifest
    tools_available:
      - elevenlabs_tts
      - tts_selector
      - kling_official_video
      - seedance_video
      - video_selector
      - flux_image
      - image_selector
      - audio_mixer
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - ElevenLabs TTS audio synthesized using CHARLIE_VOICE_ID (GdPqjbdsuwHYqzHrC45c)
      - Host lip-sync video cleanly generated using approved studio portrait
      - Happy Tails dog photos cropped and positioned
      - BGM acoustic guitar audio track present and leveled
    success_criteria:
      - Schema-valid asset_manifest artifact
      - All segment voiceovers, host clips, and dog photos present on disk

  - name: edit
    skill: pipelines/lonestar-doxietalk/edit-director
    required_artifacts_in:
      - asset_manifest
      - scene_plan
    produces:
      - edit_decisions
    tools_available:
      - video_compose
      - video_stitch
      - video_trimmer
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Seamless cut points between host dialogue, Happy Tails montage, and conclusion
      - Lower-third CTDR branding and dog names properly timed
      - Audio ducking curve keeps Charlie's voice crystal clear over music
    success_criteria:
      - Schema-valid edit_decisions artifact
      - Render runtime locked to Remotion for composite reels + FFmpeg for master stitch

  - name: compose
    skill: pipelines/lonestar-doxietalk/compose-director
    required_artifacts_in:
      - edit_decisions
      - asset_manifest
    produces:
      - render_report
    tools_available:
      - video_compose
      - video_stitch
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Master episode MP4 rendered cleanly at 1080p/720p 16:9
      - No dropped frames, audio sync drift, or subtitle clipping
      - Final deliverable stored in renders/final_episode.mp4
    success_criteria:
      - Schema-valid render_report artifact
      - Master video file exists and plays smoothly

  - name: publish
    skill: pipelines/lonestar-doxietalk/publish-director
    required_artifacts_in:
      - render_report
      - script
    produces:
      - publish_manifest
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - YouTube description includes episode overview, timestamps, CTDR donation links, and hashtags
      - "Proper URL placeholders formatted as [INSERT URL: ...] where needed"
      - Custom 16:9 thumbnail ready for YouTube upload
    success_criteria:
      - Schema-valid publish_manifest artifact
      - Complete YouTube description and thumbnail generated
